<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração comparada · 2º turno 2026</title>
<meta name="description" content="Apuração do 2º turno presidencial comparando cada urna com a mesma urna no 1º turno, com projeção do resultado e nível de confiança.">
<!--
  Painel público. Mesmo desenho do web/index.html (faixa do topo, cards, gráfico, mapa, mesmas urnas, regiões),
  sem controles de ensaio nem urna a urna, e com as explicações recolhidas.
  Duas fontes de dados:
    ao vivo  -> api/publico/estado e api/publico/municipios (servidor com --publico; respostas prontas por ciclo)
    demo     -> dados/<ano>.json (noites reais de 2022 e 2018 em quadros; python -m apuracao.publico)
  A versão estática (site/gerar.py) liga a demo trocando FONTE_DEMO.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --mute: #6b6b70; --line: #e3e1dc;
  --a: #d1342f; --b: #2463c9; --hl: #fff6d6; --proj: #9a7b20; --aviso-bg: #fff5e0; --aviso: #7a4f00; --link: #1d5fa8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --card: #1d1d20; --ink: #ececee; --mute: #9a9aa2; --line: #303035;
          --a: #f0605a; --b: #5b93ee; --hl: #3a3420; --proj: #d8b44a; --aviso-bg: #2d2513; --aviso: #f0c46a; --link: #7cb2ef; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1380px; margin: 0 auto; padding: 14px 20px 60px; }
a { color: var(--link); }
.num { font-variant-numeric: tabular-nums; }
.pa { color: var(--a); font-weight: 600; } .pb { color: var(--b); font-weight: 600; }
.mute { color: var(--mute); } .nota { font-size: 12px; color: var(--mute); }
.hidden { display: none !important; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
.sub { color: var(--mute); font-size: 12.5px; margin: 0 0 10px; }
button { font: inherit; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
button.on { background: var(--ink); color: var(--card); }
.seg { display: inline-flex; gap: 0; } .seg button { border-radius: 0; margin-left: -1px; font-size: 12.5px; min-height: 34px; }
.seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; } .seg button:last-child { border-radius: 0 7px 7px 0; }
.conf { font-weight: 700; padding: 2px 9px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.conf.alta { background: #1f8a4c; color: #fff; } .conf.tendencia { background: #f3c64a; color: #3a2a00; }
.conf.indefinido { background: var(--line); color: var(--ink); } .conf.instavel { background: #c23434; color: #fff; }
.chartbox { position: relative; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 5px 7px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--mute); font-weight: 500; position: sticky; top: 0; background: var(--card); cursor: pointer; user-select: none; white-space: normal; vertical-align: bottom; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
tbody tr:hover { background: var(--hl); }
.scroll { max-height: 560px; overflow: auto; -webkit-overflow-scrolling: touch; }
.swing { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.swing i { display: inline-block; height: 9px; border-radius: 2px; }

/* cabeçalho */
.topo { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.topo .in { max-width: 1380px; margin: 0 auto; padding: 8px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.topo .tit { font-weight: 750; font-size: 15px; }
.topo .vivo { background: #c23434; color: #fff; border-radius: 99px; padding: 1px 9px; font-weight: 700; font-size: 12px; }
.topo .demo { background: #f3c64a; color: #3a2a00; border-radius: 99px; padding: 1px 9px; font-weight: 700; font-size: 12px; }
.topo .dir { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; }
.aviso { background: var(--aviso-bg); color: var(--aviso); font-size: 12.5px; padding: 6px 20px; text-align: center; }
.aviso b { color: inherit; }
.demobar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; padding: 10px 14px; }
.demobar input[type=range] { flex: 1 1 220px; accent-color: var(--proj); min-height: 34px; }
.demobar .hora { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; min-width: 9.5em; }
.demobar .play { min-width: 44px; min-height: 34px; }
#segAno button[data-ano="2026"] { font-weight: 700; }
#segAno button[data-ano="2026"]::before { content: "● "; color: #c23434; }
#segAno button.on[data-ano="2026"]::before { color: #ff7b7b; }
.espera { display: grid; gap: 14px; }
.espera .msg { padding: 22px 22px; display: grid; gap: 10px; }
.espera h1 { font-size: clamp(22px, 4vw, 30px); margin: 0; line-height: 1.15; }
.espera .cont { font-size: clamp(28px, 6vw, 44px); font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.espera p { margin: 0; font-size: 15px; max-width: 60rem; }
.espera .cands { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.espera .cand { display: flex; align-items: center; gap: 14px; }
.espera .cand .nm { font-size: 18px; }
.espera .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.espera .acoes button { min-height: 40px; }
@media (max-width: 600px) { .espera .cands { grid-template-columns: 1fr; } }
.pausa { border: 2px solid #f0b429; display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; margin-bottom: 12px; }
.pausa .rel { grid-row: span 3; font-size: clamp(40px, 7vw, 56px); font-weight: 800; font-variant-numeric: tabular-nums; color: #b45309; line-height: 1; }
.pausa h2 { margin: 0; font-size: 20px; } .pausa p { margin: 0; font-size: 14px; color: var(--mute); }
@media (max-width: 600px) { .pausa { grid-template-columns: 1fr; } .pausa .rel { grid-row: auto; } }
.topo .compartilhar { font-size: 13px; padding: 2px 10px; border-radius: 99px; }
button.compartilhar.cheio { background: #1d4ed8; border-color: #1d4ed8; color: #fff; font-size: 15px; padding: 9px 18px; border-radius: 99px; }

/* ajuda recolhida */
details.ajuda { margin-top: 8px; font-size: 12.5px; color: var(--mute); }
details.ajuda > summary { cursor: pointer; color: var(--link); list-style: none; display: inline-block; padding: 2px 0; }
details.ajuda > summary::-webkit-details-marker { display: none; }
details.ajuda > summary::before { content: "ⓘ "; }
details.ajuda[open] > summary { margin-bottom: 4px; }
details.ajuda p { margin: 4px 0; }

/* mapa */
.mapa svg { width: 100%; height: 100%; display: block; }
.mapa path.m { stroke: var(--card); stroke-width: .15; }
.mapa path.u { fill: none; stroke: var(--ink); stroke-opacity: .45; stroke-width: .6; pointer-events: none; }
.escala { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mute); flex-wrap: wrap; }
.escala .g { height: 9px; width: 130px; border-radius: 3px; }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
       padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; max-width: 260px; }

/* faixa do topo e cards no estilo do TSE */
.faixa { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-bottom: 12px; font-size: 14px; }
.faixa .resumo { flex: 1 1 420px; }
.faixa .chip { border: 1px solid var(--line); border-left-width: 4px; border-radius: 7px; padding: 4px 10px; background: var(--card); }
.faixa .chip.fraco { border-left-width: 1px; color: var(--mute); }
.tse { display: grid; grid-template-columns: 1fr 1.25fr 1.25fr; gap: 14px; }
.tse .kv2 { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.prog { position: relative; height: 22px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: #9bb83a; }
.prog span { position: absolute; inset: 0; text-align: center; font-weight: 700; font-size: 13px; line-height: 22px; color: var(--ink); }
#tCands { display: contents; }
.cand-tse { display: flex; flex-direction: column; gap: 6px; }
.cand-tse .topo2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.anel { position: relative; width: 96px; height: 96px; flex: none; }
.anel svg { position: absolute; inset: 0; }
.anel img, .anel .sig { position: absolute; left: 10px; top: 10px; width: 76px; height: 76px; border-radius: 50%; object-fit: cover; }
.anel .sig { display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 750; background: var(--bg); }
.cand-tse .apur { text-align: right; }
.cand-tse .rot { font-size: 11.5px; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; }
.cand-tse .pct { font-size: 34px; font-weight: 750; letter-spacing: -.5px; line-height: 1.1; }
.cand-tse .nm { font-size: 19px; }
.cand-tse .proj { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
.cand-tse .pjn { font-size: 26px; font-weight: 750; }

/* corpo */
.corpo { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; margin-top: 14px; }
.linha3 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 14px; margin-top: 14px; }
.mesmas .linha { display: grid; grid-template-columns: 90px 1fr 64px; align-items: center; gap: 8px; margin: 9px 0; }
.mesmas .trilho { height: 12px; border-radius: 6px; background: var(--b); position: relative; overflow: hidden; }
.mesmas .trilho i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--a); }
.mesmas .trilho b { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--card); }
.swingbig { font-size: 26px; font-weight: 750; }
.regioes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; }
.regioes .card { padding: 10px 12px; }
.regioes b { display: block; font-size: 12.5px; }
details.bloco { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; }
details.bloco > summary { cursor: pointer; font-weight: 650; font-size: 14px; min-height: 28px; }
details.bloco[open] > summary { margin-bottom: 10px; }

/* como funciona */
#como-funciona { margin-top: 28px; scroll-margin-top: 70px; }
#como-funciona > h2 { font-size: 20px; margin: 0 0 4px; }
.metodo { font-size: 14px; line-height: 1.55; max-width: 60rem; }
.metodo p, .metodo ul, .metodo ol { margin: 0 0 10px; }
.metodo ul, .metodo ol { padding-left: 1.3rem; }
.metodo li { margin: 4px 0; }
.formula { font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--bg); padding: 4px 8px; border-radius: 5px; display: inline-block; max-width: 100%; overflow-x: auto; }
.niveis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 10px; margin-bottom: 10px; }
.niveis div { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.niveis p { margin: 6px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 10px; margin: 6px 0 12px; }
.tiles div { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.tiles .k { font-size: 24px; font-weight: 750; display: block; }
tr.destaque td { background: var(--aviso-bg); }
tr.pres td:first-child { font-weight: 650; }
.limite { border-left: 3px solid #c23434; padding-left: 12px; }
footer { margin-top: 22px; }

@media (max-width: 1000px) { .tse, .corpo, .linha3 { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  main { padding: 10px 16px 40px; } .topo .in { padding: 8px 16px; } .aviso { padding: 6px 16px; }
  .regioes { grid-template-columns: repeat(2, 1fr); }
  .card { padding: 14px; } .cand-tse .pct { font-size: 30px; } .swingbig { font-size: 20px; }
  .topo .dir { margin-left: 0; width: 100%; justify-content: space-between; }
}
</style>
</head>
<body>
<header class="topo"><div class="in">
  <span class="tit">2º turno · Presidente</span>
  <span id="selo"></span>
  <span class="dir"><span class="nota" id="atu"></span><a href="https://apuracao.dalmolin.dev/governador.html">Governadores</a><a href="#como-funciona">Como funciona</a><button type="button" class="compartilhar">Compartilhar</button></span>
</div></header>
<div class="aviso"><b>Projeção é estimativa estatística, não resultado oficial.</b> O resultado oficial é o do TSE (<a href="https://resultados.tse.jus.br" style="color:inherit">resultados.tse.jus.br</a>).</div>
<main id="root"></main>
<div id="tip"></div>

<script>
const FONTE_DEMO = true;   // a versão estática troca para true
// ================================================================ utilidades
const fmt = new Intl.NumberFormat('pt-BR');
const f1 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const f2 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const n = v => v == null ? '—' : fmt.format(Math.round(v));
const p1 = v => v == null ? '—' : f1.format(v) + '%';
const p2 = v => v == null ? '—' : f2.format(v) + '%';
const sn = v => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmt.format(Math.abs(Math.round(v)));
const pp = v => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + f1.format(Math.abs(v));
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const $ = id => document.getElementById(id);
const txt = (id, h) => { const e = $(id); if (e) e.innerHTML = h; };
let E = null, A = 'A', B = 'B', MUN = null;
const curto = s => /^Candidat[oa] [A-Z]$/.test(s) ? s : s.split(' ')[0];
const hm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}h${String(Math.round(m) % 60).padStart(2, '0')}`;

function swingTxt(s, unid = ' pt') {
  if (s == null) return '—';
  if (Math.abs(s) < 0.05) return '0,0' + unid;
  return s > 0 ? `<span class="pa">${curto(A)} +${f1.format(s)}${unid}</span>` : `<span class="pb">${curto(B)} +${f1.format(-s)}${unid}</span>`;
}
function swingCel(s, max = 8) {
  if (s == null) return '—';
  const w = Math.min(Math.abs(s) / max, 1) * 40;
  return `<span class="swing">${s > 0 ? curto(A) : s < 0 ? curto(B) : ''} ${f1.format(Math.abs(s))}<i style="width:${w}px;background:${s >= 0 ? 'var(--a)' : 'var(--b)'}"></i></span>`;
}
function pctApurado() { const o = E.oficial_br; return o && o.ts ? 100 * o.st / o.ts : 0; }
function confDica(cf) {
  let d = `Margem de erro (95%): ±${f1.format(cf.faixa95)} pt`;
  if (cf.faixa95_hist != null && cf.faixa95 > cf.faixa95_hist + 0.01) d += ` (ampliada pela noite atual; histórica ±${f1.format(cf.faixa95_hist)})`;
  if (cf.cobertura_min_regiao != null && cf.cobertura_min_regiao < 10) d += '. Alguma região tem menos de 10% apurado: ainda não pode haver confiança alta';
  if (cf.nivel === 'instavel') d += `. A projeção mudou ${f1.format(cf.variacao_5pp)} pt nos últimos 5% apurados: as urnas que estão chegando votam diferente das anteriores`;
  return d + '.';
}
function confPill() {
  const cf = E.confianca;
  if (!cf) return '<span class="conf indefinido">Aguardando urnas</span>';
  const lid = cf.lider === 'a' ? curto(A) : curto(B);
  const t = {alta: `Alta confiança · ${lid} vence`, tendencia: `Tendência · ${lid} à frente`, instavel: 'Instável', indefinido: 'Indefinido'}[cf.nivel];
  return `<span class="conf ${cf.nivel}" title="${confDica(cf)}">${t}</span>`;
}
function frase() {
  const t = E.total, cf = E.confianca, ap = pctApurado();
  if (!t.st2) return 'Nenhuma urna apurada ainda. A projeção começa com as primeiras urnas.';
  const lid = t.proj_a_pct >= 50 ? A : B, pl = Math.max(t.proj_a_pct, 100 - t.proj_a_pct);
  const sw = t.swing, quem = sw >= 0 ? A : B;
  let s = `Com ${p1(ap)} das urnas, a projeção dá <b>${lid} com ${p1(pl)}</b> dos votos válidos. `;
  s += `Nas mesmas urnas, ${curto(quem)} está ${f1.format(Math.abs(sw))} pt melhor que no 1º turno. `;
  if (cf && cf.nivel === 'alta') s += `Confiança alta desde ${p1(cf.desde_pct)} apurado.`;
  else if (cf && cf.nivel === 'instavel') s += `Atenção: a projeção mudou ${f1.format(cf.variacao_5pp)} pt nos últimos 5% apurados.`;
  else if (cf) s += `Ainda dentro da margem de erro (±${f1.format(cf.faixa95)} pt): pode mudar.`;
  return s;
}

// ---- cores
function mix(c1, c2, t) {
  const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = h(c1), b = h(c2);
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
}
const escuro = matchMedia('(prefers-color-scheme: dark)').matches;
const NEUTRO = escuro ? '#34343a' : '#e6e3dc', CA = escuro ? '#f0605a' : '#d1342f', CB = escuro ? '#5b93ee' : '#2463c9';
const div = (v, max) => v == null ? NEUTRO : v >= 0 ? mix(NEUTRO, CA, Math.min(v / max, 1)) : mix(NEUTRO, CB, Math.min(-v / max, 1));

// ================================================================ fonte de dados: ao vivo (servidor) ou demonstração (quadros estáticos)
const Q = new URLSearchParams(location.search);
const DEMO = FONTE_DEMO || Q.has('demo');
// versão estática: config.json diz onde está o servidor ao vivo (túnel) e quem são os candidatos de 2026
let CFG = {api: null, candidatos: null};
async function config() {
  if (!DEMO) return;
  try { CFG = await (await fetch('config.json', {cache: 'no-cache'})).json(); } catch (e) {}
}
const vivo = () => !DEMO || fonte.ano === '2026';
const API = () => DEMO ? (CFG.api || null) : '';
const fonte = {
  ano: Q.get('demo') && /^(2018|2022)$/.test(Q.get('demo')) ? Q.get('demo') : DEMO ? '2026' : null, D: {}, i: 0, n: 0,
  async estado() {
    if (vivo()) {
      if (API() == null) throw new Error('sem servidor');
      const r = await fetch(API() + 'api/publico/estado', {cache: 'no-cache'});
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }
    const D = await this.dados(), q = D.quadros[this.i];
    return {...q.estado, snapshots: D.snapshots.slice(0, q.estado.n_snap)};
  },
  async municipios() {
    // parte fixa (nomes, 1º turno) uma vez; a cada ciclo, só as colunas que mudam
    let f, var_;
    if (vivo()) {
      const v = await (await fetch(API() + 'api/publico/municipios', {cache: 'no-cache'})).json();
      if (!this.base || this.base.chave !== v.chave) this.base = await (await fetch(API() + 'api/publico/mun_base')).json();
      f = this.base; var_ = v.mun;
    } else {
      const D = await this.dados(); f = D.mun_fixo; var_ = D.quadros[this.i].mun;
    }
    const ks = Object.keys(var_);
    return {cols: [...f.cols, ...ks], rows: f.rows.map((r, j) => [...r, ...ks.map(k => var_[k][j])])};
  },
  async dados() {
    if (!this.D[this.ano]) this.D[this.ano] = await (await fetch(`dados/${this.ano}.json`)).json();
    this.n = this.D[this.ano].quadros.length;
    return this.D[this.ano];
  },
};

// ================================================================ mapa por município
let GEO = null;
async function geo() {
  if (GEO) return GEO;
  const [mun, uf, tse] = await Promise.all(['municipios_leve.geojson', 'uf_leve.geojson', 'tse_ibge.json'].map(f => fetch('geo/' + f).then(r => r.json())));
  const ibge2tse = Object.fromEntries(Object.entries(tse).map(([k, v]) => [v, k]));
  mun.features.forEach(f => f.properties.k = ibge2tse[f.properties.codarea]);
  return GEO = {mun, uf};
}
async function criaMapa(el) {
  const g = await geo();
  const w = el.clientWidth || 600, h = el.clientHeight || 600;

  el.innerHTML = head + '<tbody>' + sorted.map(r => '<tr>' + cols.map(c => `<td class="${c.l ? 'l' : ''} num">${c.f ? c.f(r[c.k], r) : (r[c.k] ?? '—')}</td>`).join('') + '</tr>').join('') + '</tbody>';
  el.querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k; ord.d = ord.k === k ? -ord.d : (typeof rows[0]?.[k] === 'string' ? 1 : -1); ord.k = k; onSort();
  });
}

}

// ================================================================ espera (antes da primeira urna publicada pelo TSE)
const INICIO = Date.parse('2026-10-25T17:00:00-03:00');
function falta() {
  const ms = INICIO - Date.now();
  if (ms <= 0) return null;
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
  return h ? `${h}h ${String(m).padStart(2, '0')}min` : `${m}min ${String(s).padStart(2, '0')}s`;
}
function espera(mostrar) {
  $('espera').classList.toggle('hidden', !mostrar);
  $('painel').classList.toggle('hidden', mostrar);
  if (!mostrar) return;
  const c = (E && E.candidatos) || CFG.candidatos || {a: {numero: '13', nome: 'Lula'}, b: {numero: '22', nome: 'Flávio Bolsonaro'}};
  const f = falta();
  const card = (l, x, cor) => `<div class="card cand">${anel(0, cor, x.nome.split(' ').map(p => p[0]).slice(0, 2).join(''), fotoUrl(l, x.numero, x.nome))}
    <div><div class="nota">${x.numero}</div><div class="nm"><b>${x.nome.toUpperCase()}</b></div></div></div>`;
  txt('espera', `
    <div class="card msg">
      <span class="nota">2º turno · Presidente · domingo, 25 de outubro de 2026</span>
      <h1>${f ? 'A apuração começa às 17h (horário de Brasília)' : faltaReabre() ? 'Votação prorrogada até as 19h por decisão do STF. A divulgação do TSE recomeça depois disso.' : 'As urnas fecharam. Aguardando as primeiras urnas totalizadas pelo TSE.'}</h1>
      ${f ? `<div class="cont" id="cont">faltam ${f}</div>` : faltaReabre() ? `<div class="cont">recomeça em <span id="relEspera">${faltaReabre()}</span></div>` : ''}
      <p>Este painel só mostra números depois que o TSE publicar as primeiras urnas totalizadas no site oficial de resultados (<a href="https://resultados.tse.jus.br">resultados.tse.jus.br</a>). A partir daí, cada urna apurada é comparada com a mesma urna no 1º turno, e a projeção do resultado final aparece com a sua margem de erro e o nível de confiança.</p>
      <p class="mute">A projeção é uma estimativa estatística, não o resultado oficial. Esta página se atualiza sozinha: não precisa recarregar.</p>
      ${DEMO ? `<div class="acoes"><button data-ir="2022">Ver como foi a noite de 2022 ▸</button><button data-ir="2018">Ver 2018 ▸</button><a href="#como-funciona" style="align-self:center">Como funciona</a></div>` : ''}
    </div>
    <div class="cands">${card('a', c.a, 'var(--a)')}${card('b', c.b, 'var(--b)')}</div>`);
  document.querySelectorAll('#espera [data-ir]').forEach(b => b.onclick = () => document.querySelector(`#segAno [data-ano="${b.dataset.ir}"]`).click());
}
setInterval(() => { const e = $('cont'), f = falta(); if (e && f) e.textContent = 'faltam ' + f; }, 1000);

// 25/10, 17h07: o STF prorrogou a votação até as 19h e o TSE parou a divulgação; até lá, aviso com contagem e consulta a cada minuto
const REABRE = Date.parse('2026-10-25T19:00:00-03:00');
function faltaReabre() {
  const ms = REABRE - Date.now();
  return ms > 0 ? `${String(Math.floor(ms / 60000)).padStart(2, '0')}:${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')}` : null;
}
const intervalo = () => { const ms = REABRE - Date.now(); return ms > 0 ? Math.min(60000, ms + 3000) : 15000; };
function pausa() {
  const mostrar = !!faltaReabre() && vivo() && !!E && !$('painel').classList.contains('hidden');
  $('pausa').classList.toggle('hidden', !mostrar);
  if (!mostrar || $('relPausa')) return;
  const h = ((E.oficial_br && E.oficial_br.dt) || '').slice(-8, -3).replace(':', 'h');
  txt('pausa', `<div class="rel" id="relPausa">${faltaReabre()}</div><h2>A divulgação do TSE recomeça às 19h</h2>
    <p>O STF prorrogou a votação até as 19h em todo o país. Os números abaixo são parciais${h ? `, do último envio do TSE (${h})` : ''}.</p>
    <div><button type="button" class="compartilhar cheio">Compartilhar o painel</button></div>`);
}
setInterval(() => {
  const g = faltaReabre();
  ['relPausa', 'relEspera'].forEach(id => { const e = $(id); if (e && g) e.textContent = g; });
  if (!g && !$('pausa').classList.contains('hidden')) pausa();
}, 1000);
// compartilhar: no celular, a folha de compartilhamento do aparelho; no computador, copia o link
document.addEventListener('click', async ev => {
  const b = ev.target.closest('button.compartilhar');
  if (!b) return;
  const url = location.href.split('#')[0];
  if (navigator.share) { try { await navigator.share({title: document.title, text: 'Apuração do 2º turno comparando cada urna com a mesma urna no 1º turno', url}); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); const o = b.textContent; b.textContent = 'Link copiado ✓'; setTimeout(() => b.textContent = o, 2000); } catch (e) {}
});

// ================================================================ ciclo
P.montar();
let nSnapMun = -1;
async function atualiza() {
  let novo;
  try { novo = await fonte.estado(); }
  catch (e) {
    // antes das 17h (ou com o servidor ainda fora do ar) é só espera; depois de ter havido dados, avisa a falha
    if (E && E.oficial_br && E.oficial_br.st && vivo()) { E.ok = false; txt('tFaixa', '<span class="conf instavel">Sem conexão com o servidor. Tentando de novo…</span>'); }
    else { E = null; espera(true); cabecalho(); }
    return;
  }
  E = novo;
  if (!E.oficial_br || !E.oficial_br.st || !E.snapshots.length) { espera(true); cabecalho(); return; }
  espera(false);
  A = E.candidatos.a.nome; B = E.candidatos.b.nome;
  // municípios só quando chega dado novo (não a cada atualização da página)
  const ns = E.snapshots.length + (DEMO ? fonte.ano + fonte.i : '');
  if (ns !== nSnapMun || !MUN) {
    try {   // se falhar, fica o mapa anterior e tenta de novo no próximo ciclo
      const j = await fonte.municipios();
      MUN = Object.fromEntries(j.rows.map(r => { const o = Object.fromEntries(j.cols.map((c, i) => [c, r[i]])); return [`${o.uf}-${o.mun}`, o]; }));
      nSnapMun = ns;
    } catch (e) {}
  }
  P.desenhar();
  cabecalho();
}
function cabecalho() {
  if (DEMO) {
    document.querySelectorAll('#segAno button').forEach(b => b.classList.toggle('on', b.dataset.ano === fonte.ano));
    $('dControles').classList.toggle('hidden', vivo()); $('dVivo').classList.toggle('hidden', !vivo());
  }
  if (DEMO && !vivo()) {
    txt('selo', `<span class="demo">DEMONSTRAÇÃO · ${fonte.ano}, votos reais</span>`);
    const ult = E.snapshots.at(-1);
    txt('atu', ''); txt('dHora', ult ? `${hm(ult.minuto)} · ${p1(pctApurado())}` : '—');
    $('dSlider').max = fonte.n - 1; $('dSlider').value = fonte.i;
    document.querySelectorAll('#segAno button').forEach(b => b.classList.toggle('on', b.dataset.ano === fonte.ano));
  } else {
    // o selo segue o modo do servidor: "ao vivo" só com o 2º turno de verdade
    const sel = E && {'ao-vivo': '<span class="vivo">AO VIVO</span>', 'teste-r1': '<span class="demo">TESTE · 1º turno lido como 2º</span>'}[E.modo]
      || E && `<span class="demo">ENSAIO${E.cenario ? ' ' + E.cenario : ''} · não é a apuração real</span>`;
    txt('selo', E ? sel : '<span class="demo">2º TURNO 2026 · aguardando o TSE</span>');
    txt('atu', E && E.oficial_br && E.oficial_br.dt ? `TSE: ${E.oficial_br.dt}` : '');
  }
  pausa();
}
// contador anônimo de leitores (só para nós): um número aleatório por aba, sem cookie; só com o servidor ao vivo e a aba visível
const LEITOR = Math.random().toString(36).slice(2) + Date.now().toString(36);
function sinal() {
  if (document.visibilityState !== 'visible' || API() == null) return;
  fetch(API() + 'api/leitor?id=' + LEITOR, {cache: 'no-store'}).catch(() => {});
}
setTimeout(sinal, 5000); setInterval(sinal, 120000);
document.addEventListener('visibilitychange', sinal);
let laco = null;
async function lacoVivo() { clearTimeout(laco); if (!vivo()) return; await atualiza(); laco = setTimeout(lacoVivo, E && E.ok !== false ? intervalo() : 5000); }
if (DEMO) {
  let tocando = null;
  const para = () => { clearInterval(tocando); tocando = null; $('dPlay').textContent = '▶'; };
  const vai = async i => { fonte.i = Math.max(0, Math.min(i, fonte.n - 1)); await atualiza(); };
  $('dSlider').oninput = e => vai(+e.target.value);
  $('dPlay').onclick = () => {
    if (tocando) return para();
    if (fonte.i >= fonte.n - 1) fonte.i = 0;
    $('dPlay').textContent = '⏸';
    tocando = setInterval(async () => { if (fonte.i >= fonte.n - 1) return para(); await vai(fonte.i + 1); }, 1400);
  };
  const escolhe = async ano => {
    para(); clearTimeout(laco); fonte.ano = ano; E = null; MUN = null; nSnapMun = -1;
    try { history.replaceState(null, '', ano === '2026' ? location.pathname : `?demo=${ano}`); } catch (e) {}
    if (ano === '2026') { await config(); return lacoVivo(); }
    await fonte.dados(); fonte.i = fonte.D[ano].quadros.findIndex(q => q.estado.oficial_br.st / q.estado.oficial_br.ts >= .05); await atualiza();
  };
  document.querySelectorAll('#segAno button').forEach(b => b.onclick = () => escolhe(b.dataset.ano));
  escolhe(fonte.ano);
  setInterval(config, 60000);   // o endereço do túnel pode mudar durante a noite
} else {
  lacoVivo();
}
</script>
